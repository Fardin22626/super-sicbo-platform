<!DOCTYPE html>
<html>
<head><title>Super Sic Bo</title></head>
<body style="background:#111;color:#fff;text-align:center;padding:50px;font-family:sans-serif;">
    <div style="max-width:350px;margin:auto;background:#222;padding:20px;border:1px solid gold;border-radius:8px;">
        <h2>SUPER SIC BO</h2>
        <input id="u" value="Fardin22626" style="width:100%;padding:8px;margin:5px 0;box-sizing:border-box;"><br>
        <input id="p" type="password" value="Fardin@2003" style="width:100%;padding:8px;margin:5px 0;box-sizing:border-box;"><br>
        <button onclick="doLogin()" style="width:100%;padding:10px;background:gold;font-weight:bold;cursor:pointer;border:none;">Login</button>
        <p id="err" style="color:red;font-size:13px;"></p>
    </div>
    <script>
    async function doLogin() {
        try {
            let res = await fetch("/api/auth/login", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({username: document.getElementById("u").value, password: document.getElementById("p").value})
            });
            let data = await res.json();
            if(data.success) {
                alert("Login Successful!");
                location.reload();
            } else {
                document.getElementById("err").innerText = data.message || "Login failed";
            }
        } catch(e) {
            document.getElementById("err").innerText = "Connection error";
        }
    }
    </script>
</body>
</html>
