<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUPER SIC BO</title>
    <style>
        body { font-family: sans-serif; background: #1a1a1a; color: #fff; padding: 20px; text-align: center; }
        .wrapper { max-width: 460px; margin: auto; background: #262626; padding: 20px; border-radius: 14px; border: 2px solid #d4af37; box-shadow: 0 0 25px rgba(212,175,55,0.2); }
        button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 6px; border: 1px solid #444; font-size: 15px; background: #d4af37; color: #00000d; font-weight: bold; cursor: pointer; }
        input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 6px; border: 1px solid #444; background: #111; color: #fff; box-sizing: border-box; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="wrapper">
        <div id="authScreen">
            <h2>SUPER SIC BO</h2>
            <p style="font-size: 12px; color: #aaa;">Official Gaming Platform</p>
            <input type="text" id="usernameInput" placeholder="Username" value="Fardin22626">
            <input type="password" id="passwordInput" placeholder="Password" value="Fardin@2003">
            <button type="button" onclick="performAuth()">Continue</button>
            <p id="authError" style="color: #ff5252; font-size: 13px; margin-top: 8px;"></p>
        </div>
        <div id="gameScreen" class="hidden">
            <h2>Welcome, <span id="userDisplay"></span>!</h2>
            <p>Balance: $<span id="balanceDisplay">5000</span></p>
            <button type="button" onclick="location.reload()">Logout</button>
        </div>
    </div>
    <script>
    async function performAuth() {
        const username = document.getElementById('usernameInput').value;
        const password = document.getElementById('passwordInput').value;
        try {
            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();
            if (data.success) {
                document.getElementById('authScreen').classList.add('hidden');
                document.getElementById('gameScreen').classList.remove('hidden');
                document.getElementById('userDisplay').innerText = data.user ? data.user.username : username;
                document.getElementById('balanceDisplay').innerText = data.user && data.user.balance !== undefined ? data.user.balance : 5000;
            } else {
                document.getElementById('authError').innerText = data.message;
            }
        } catch (err) {
            console.error(err);
            document.getElementById('authError').innerText = 'Network error occurred';
        }
    }
    </script>
</body>
</html>
